<title>RC 단면 내력 계산기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&family=IBM+Plex+Sans+JP:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
/* layout: 왼쪽 입력 시트 + 오른쪽 단면도·결과, 좁으면 1열 */
:root {
  --bg: #eef0f1; --panel: #ffffff; --fg: #1d2326; --muted: #5d676c;
  --line: #cfd5d8; --accent: #1f5f8b; --block: #9fb7c8; --warn: #a1452a; --ok: #2e7d4f;
  --conc: #c9ccce; --crack: #b8372a; --steel: #2b3a42;
  --sans: "IBM Plex Sans KR", "IBM Plex Sans JP", "Apple SD Gothic Neo", "Hiragino Sans", "Malgun Gothic", "Yu Gothic", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15191b; --panel: #1e2427; --fg: #e3e8ea; --muted: #97a3a9;
  --line: #343d42; --accent: #6fb0dc; --block: #3d5a6e; --warn: #e48a6b; --ok: #6cc592; --conc: #4a5257; --crack: #e2604f; --steel: #d7dde0; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15191b; --panel: #1e2427; --fg: #e3e8ea; --muted: #97a3a9;
  --line: #343d42; --accent: #6fb0dc; --block: #3d5a6e; --warn: #e48a6b; --ok: #6cc592; --conc: #4a5257; --crack: #e2604f; --steel: #d7dde0; color-scheme: dark }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); padding: 24px 16px; }
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: flex-start; }
header > div { min-width: 0; flex: 1 1 320px; }
.tools button.sec { background: var(--panel); color: var(--accent); border-color: var(--accent); }
.tools button.view { font-size: .75rem; padding: 3px 8px; }
h1 { font-size: 1.5rem; font-weight: 600; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
button { font: 600 .8rem var(--sans); padding: 6px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--fg); cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); }
#xl { border-color: var(--accent); color: var(--accent); }
#xlMsg { font-size: .75rem; color: var(--muted); }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 20px; }
@media (max-width: 760px) { .grid { grid-template-columns: minmax(0, 1fr); } }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; min-width: 0; }
h2 { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
fieldset { border: 0; padding: 0; margin: 0 0 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
legend { font-weight: 600; margin-bottom: 8px; padding: 0; }
label { display: grid; gap: 3px; font-size: .8rem; color: var(--muted); }
input { font: 500 .95rem var(--mono); padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); width: 100%; box-sizing: border-box; }
input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
select { font: 500 .95rem var(--mono); padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); width: 100%; box-sizing: border-box; }
.tot { grid-column: 1 / -1; font: 500 .85rem var(--mono); color: var(--fg); margin: 0; }
#cmpTbl input, #cmpTbl select { width: 100%; box-sizing: border-box; font: inherit; font-size: .8rem; }
#cmpTbl th { font-size: .72rem; font-weight: 600; text-align: left; }
#cmpTbl td, #cmpTbl th { padding: 2px 3px; }
.res { display: grid; gap: 14px; align-content: start; }
.big { display: flex; flex-wrap: wrap; gap: 12px; }
.big div { flex: 1 1 140px; border-left: 3px solid var(--accent); padding: 4px 10px; }
.big b { display: block; font: 500 1.5rem var(--mono); font-variant-numeric: tabular-nums; }
.big span { font-size: .8rem; color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: .85rem; }
td { padding: 4px 0; border-bottom: 1px solid var(--line); }
td:last-child { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
#oTag { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-block; font-size: .75rem; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; }
.tag.ok { color: var(--ok); } .tag.warn { color: var(--warn); } .tag.info { color: var(--accent); }
#sec { width: 100%; max-width: 280px; display: block; margin: 0 auto; }
#mn { width: 100%; display: block; touch-action: none; }
#mn text { font: 10px var(--mono); fill: var(--muted); }
#mn .lbl { fill: var(--fg); font-family: var(--sans); font-size: 11px; }
.diag { width: 100%; display: block; }
.diag text { font: 10px var(--mono); fill: var(--muted); }
.diag .lbl { fill: var(--fg); font-family: var(--sans); font-size: 11px; font-weight: 600; }
canvas { width: 100%; height: auto; display: block; background: var(--bg); border-radius: 4px; touch-action: none; cursor: grab; }
canvas:active { cursor: grabbing; }
.f3tools button.view { font-size: .75rem; padding: 4px 9px; }
.f3tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 4px; }
.f3tools button { background: var(--accent); color: var(--panel); border-color: var(--accent); }
.f3tools button.sec { background: var(--panel); color: var(--accent); }
.f3tools button:disabled { opacity: .5; cursor: default; }
.prog { flex: 1 1 160px; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--accent); }
.status { font: .8rem var(--mono); color: var(--muted); min-width: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .78rem; color: var(--muted); margin-top: 8px; align-items: center; }
.sw { display: inline-block; width: 44px; height: 10px; vertical-align: middle; border-radius: 2px; background: linear-gradient(90deg, var(--conc), var(--crack)); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; margin-top: 14px; }
@media (max-width: 760px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
#f3pd text, .mat text { font: 10px var(--mono); fill: var(--muted); } #f3pd .lbl, .mat .lbl { fill: var(--fg); font-family: var(--sans); font-size: 11px; }
.mp text, .sd text { font: 10px var(--mono); fill: var(--muted); } .mp .lbl, .sd .lbl { fill: var(--fg); font-family: var(--sans); font-size: 11px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.grid3 h3 { font-size: .85rem; margin: 0 0 4px; font-weight: 600; }
summary { cursor: pointer; font-size: .85rem; color: var(--accent); margin-top: 8px; }
.note { font-size: .78rem; color: var(--muted); line-height: 1.6; }
</style>

<div class="wrap">
  <header>
    <div>
      <h1 data-i="title"></h1>
      <p class="sub" data-i="sub"></p>
    </div>
    <div class="tools" role="group" aria-label="Language">

        <fieldset><legend data-i="stirrups"></legend>

    </section>

  f3Note: "<b>要素</b>: 8節点六面体（2×2×2 積分）。規則格子なので種類ごとの要素剛性は一度だけ作り、要素ごとに (1 − d) を掛けます。T形はフランジ要素を別に持ち、フランジ外には要素がありません。<b>鉄筋</b>: 主鉄筋は深さ d, d′ の z = 0 面に埋込み（面積合計）、スターラップは間隔 s ごとに鉛直脚 n 本と上下の水平脚を要素内に埋込み（両端変位を形状関数で補間）。弾性–完全塑性、割線係数 min(Es, fy/|ε|)。<br><b>コンクリート</b>: 等方性損傷。要素中心の有効応力の最大主応力/Ec（Rankine）が ft/Ec を超えると指数型軟化（ひび割れ帯モデル、Gf = 73·fcm^0.18 N/m）で dt、8 積分点の最小主応力から放物線・下降線の割線比で dc。はり方向ひずみが圧縮ならひび割れ閉合として dt を剛性から除きます。(1 − d) = (1 − dt)(1 − dc)、不可逆。<br><b>解法</b>: 載荷点節点線にたわみを強制し、損傷 → 割線剛性 → バンド・コレスキーを損傷が収束するまで反復（最大 40 回）。荷重 = 載荷節点の内力の和。載荷点直下と支点直上の要素一列は線形弾性（支圧板）。<br><b>限界</b>: ひび割れは要素単位で進み、せん断ロッキングで初期剛性がはり理論より 5〜10% 高くなります。要素 200 mm は高さ方向 3 段のみで降伏前に崩壊することがあります（125 mm 以上を推奨）。付着・すべり、ひび割れ方向性、拘束効果はありません。"

  f3Note: "<b>Elements</b>: 8-node hexahedra (2×2×2 integration). The grid is regular, so each element type's stiffness is built once and scaled by (1 − d). T sections get separate flange elements; nothing outside the T. <b>Rebar</b>: main bars are embedded on the z = 0 plane at depths d and d′ (total area); stirrups at spacing s have n vertical legs and top/bottom horizontal legs embedded in the elements (end displacements interpolated with shape functions). Elastic–perfectly plastic, secant modulus min(Es, fy/|ε|).<br><b>Concrete</b>: isotropic damage. Tension damage dt grows by exponential softening (crack-band model, Gf = 73·fcm^0.18 N/m) once the maximum principal effective stress at the element centre exceeds ft (Rankine); compression damage dc follows the secant ratio of a parabola–descending curve using the minimum principal stress over the 8 Gauss points. When the beam-axis strain is compressive the crack is treated as closed and dt is dropped from the stiffness. (1 − d) = (1 − dt)(1 − dc), irreversible.<br><b>Solution</b>: deflection is imposed on the loading node line; damage → secant stiffness → banded Cholesky is repeated until the damage converges (max 40). Load = sum of internal forces at the loaded nodes. One row of elements under each load and over each support stays linear elastic (bearing plates).<br><b>Limits</b>: cracks spread element by element, and shear locking makes the initial stiffness 5–10% higher than beam theory. The 200 mm mesh has only 3 rows through the depth and may collapse before yielding (use 125 mm or finer). No bond-slip, crack orientation or confinement."

  if (!dl) { $("wfMsg").textContent = t("wfNoDl"); return; }
  $("wfMsg").textContent = "";
  try {
    if (kind === "json") await dl.save({ filename: `${caseName()}.json`, data: JSON.stringify(collectCase(), null, 2) });
    else if (kind === "report") await dl.save({ filename: `${caseName()}_report.html`, data: buildReportHTML() });
    else if (kind === "png") { if (!f3hist.length) { $("wfMsg").textContent = t("f3NeedRun"); return; } const blob = await new Promise(r => $("f3cv").toBlob(r, "image/png")); await dl.save({ filename: `${caseName()}_3d.png`, data: blob }); }
    $("wfMsg").textContent = t("exportOk");
  } catch (e) { if (e?.code !== "declined") $("wfMsg").textContent = `${t("exportFail")} (${e?.code ?? e})`; }
}
["json", "report", "png"].forEach(k => $("wf_" + k).addEventListener("click", () => wfSave(k)));

// ───────── 재료 응력–변형률 곡선 (3D 모델과 동일 식) ─────────
function materialCurves(p) {
  const Ec = EcJSCE(p.fc) * 1000, fc = p.fc, e0 = 2 * fc / Ec, ft = 0.23 * Math.pow(fc, 2 / 3), et0 = ft / Ec, Gf = 73 * Math.pow(fc + 8, 0.18) / 1000;
  const he = +($("f3ex")?.value || 125), ef = Math.max(0.5 * et0, (Gf / he - ft * et0 / 2) / ft), ey = p.fy / p.Es;
  const sigC = e => e <= e0 ? fc * (2 * e / e0 - (e / e0) ** 2) : e <= 0.0035 ? fc - 0.8 * fc * (e - e0) / (0.0035 - e0) : 0.2 * fc;
  const sigT = e => e <= et0 ? Ec * e : ft * Math.exp(-(e - et0) / ef);
  const comp = [], tens = [], steel = [];
  for (let i = 0; i <= 100; i++) { const e = 0.005 * i / 100; comp.push([e, sigC(e)]); }
  const etMax = et0 + 6 * ef; for (let i = 0; i <= 100; i++) { const e = etMax * i / 100; tens.push([e, sigT(e)]); }
  for (const e of [0, ey, 0.02]) steel.push([e, Math.min(p.fy, p.Es * e)]);
  return { Ec, e0, ft, et0, Gf, ef, ey, he, comp, tens, steel, fc, fy: p.fy };
}
// 작은 선 그래프: pts [[x,y]…], marks [[x,y,label]…]
function lineChart(id, pts, marks, xl, yl, extra = []) {
  const all = pts.concat(...extra.map(e => e.pts));
  const W = 320, H = 230, L = 48, R = 24, T = 12, B = 36, xmax = Math.max(...all.map(q => q[0])) || 1, ymax = (Math.max(...all.map(q => q[1])) || 1) * 1.12;
  const sx = v => L + v / xmax * (W - L - R), sy = v => H - B - v / ymax * (H - T - B);
  let g = "";
  const tx = niceStep(xmax / 4), ty = niceStep(ymax / 4);
  for (let v = 0; v <= xmax + 1e-12; v += tx) g += `<line x1="${sx(v)}" x2="${sx(v)}" y1="${T}" y2="${H - B}" stroke="var(--line)" stroke-width=".75"/><text x="${sx(v)}" y="${H - B + 13}" text-anchor="middle">${+v.toPrecision(3)}</text>`;
  for (let v = 0; v <= ymax; v += ty) g += `<line x1="${L}" x2="${W - R}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--line)" stroke-width=".75"/><text x="${L - 5}" y="${sy(v) + 3}" text-anchor="end">${+v.toPrecision(3)}</text>`;
  g += `<text x="${(L + W - R) / 2}" y="${H - 4}" text-anchor="middle">${xl}</text><text transform="translate(11 ${(T + H - B) / 2}) rotate(-90)" text-anchor="middle">${yl}</text>`;
  g += `<polyline points="${pts.map(q => `${sx(q[0]).toFixed(1)},${sy(q[1]).toFixed(1)}`).join(" ")}" fill="none" stroke="${extra.length ? "var(--muted)" : "var(--accent)"}" stroke-width="${extra.length ? 1.2 : 2}"/>`;
  extra.forEach((e, q) => { if (!e.pts.length) return; const lastP = e.pts[e.pts.length - 1];
    g += `<polyline points="${e.pts.map(v => `${sx(v[0]).toFixed(1)},${sy(v[1]).toFixed(1)}`).join(" ")}" fill="none" stroke="${e.stroke}" stroke-width="2"/>` +
      `<circle cx="${sx(lastP[0])}" cy="${sy(lastP[1])}" r="4" fill="${e.stroke}" stroke="var(--panel)" stroke-width="1.5"/>` +
      (e.label ? `<text class="lbl" x="${W - R - 4}" y="${T + 12 + 13 * q}" text-anchor="end" fill="${e.stroke}">● ${e.label}</text>` : ""); });
  marks.forEach(([x, y, lab]) => { const px = sx(x), py = sy(y), left = px > W - 90; g += `<circle cx="${px}" cy="${py}" r="3.5" fill="var(--fg)"/><text class="lbl" x="${px + (left ? -7 : 7)}" y="${py - 7}" text-anchor="${left ? "end" : "start"}">${lab}</text>`; });
  $(id).innerHTML = g;
}
function drawMaterials(p) {
  const m = materialCurves(p);
  lineChart("matC", m.comp, [[m.e0, m.fc, `ε′0 ${m.e0.toFixed(5)}, f′ck ${f(m.fc, 1)}`], [0.0035, 0.2 * m.fc, "ε′cu 0.0035"]], t("matEps"), t("matSig"));
  lineChart("matT", m.tens, [[m.et0, m.ft, `εt0 ${m.et0.toExponential(2)}, ft ${f(m.ft, 2)}`]], t("matEps"), t("matSig"));
  lineChart("matS", m.steel, [[m.ey, m.fy, `εy ${m.ey.toFixed(5)}, fy ${f(m.fy, 0)}`]], t("matEps"), t("matSig"));
  const rows = [[t("matK_Ec"), `${f(m.Ec, 0)} N/mm²`], [t("matK_e0"), m.e0.toFixed(5)], [t("matK_cu"), "0.0035"], [t("matK_ft"), `${f(m.ft, 2)} N/mm²`], [t("matK_et"), m.et0.toExponential(3)],
    [t("matK_Gf"), m.Gf.toFixed(4)], [t("matK_ef"), `${m.ef.toExponential(3)} (${m.he} mm)`], [t("matK_ey"), m.ey.toFixed(5)]];
  $("matTbl").innerHTML = rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("");
  last && (last.mat = m);
}

// ---------- 보 해석 ----------
const bmIds = ["bmL", "bmW", "bmP1", "bmA1", "bmP2", "bmA2"];
const imax = a => a.reduce((b, v, i) => v > a[b] ? i : b, 0), imin = a => a.reduce((b, v, i) => v < a[b] ? i : b, 0);
function renderBeam(p, r) {
  const q = Object.fromEntries(bmIds.map(k => [k, parseFloat($(k).value)])), type = $("bmType").value;
  if (!(q.bmL > 0) || bmIds.some(k => !Number.isFinite(q[k]))) { $("bmTbl").innerHTML = `<tr><td>${tag("warn", t("bmBad"))}</td><td></td></tr>`; return; }
  const Ig = r.Ig, Ec = EcJSCE(p.fc), EI = Ec * 1000 * Ig;   // 층 적분 Ig, kN/mm² → N/mm²
  const bm = beamFEM({ L: q.bmL, type, w: q.bmW, P: [[q.bmP1, q.bmA1], [q.bmP2, q.bmA2]], EI });
  const iMp = imax(bm.M), iMn = imin(bm.M), iV = imax(bm.V.map(Math.abs)), iD = imin(bm.d), dmax = -bm.d[iD];
  const at = i => `@ ${(bm.x[i] / 1000).toFixed(2)} m`, R = bm.react;
  const rows = [
    [t("bmEc"), f(Ec, 1)], [t("bmIg"), `${(Ig / 1e8).toFixed(3)} ×10⁸`],
    [t("bmMp"), `${f(Math.max(0, bm.M[iMp]))} kN·m ${at(iMp)}`], [t("bmMn"), `${f(Math.min(0, bm.M[iMn]))} kN·m ${at(iMn)}`],
    [t("bmVmax"), `${f(Math.abs(bm.V[iV]))} kN ${at(iV)}`], [t("bmDmax"), `${f(dmax, 2)} mm ${at(iD)} · L/${dmax > 0 ? f(q.bmL / dmax, 0) : "∞"}`],
    [t("bmR"), `RA ${f(R.RA)}${R.MA != null ? `, MA ${f(R.MA)}` : ""}${R.RB != null ? `, RB ${f(R.RB)}` : ""}${R.MB != null ? `, MB ${f(R.MB)}` : ""}`]
  ];
  $("bmTbl").innerHTML = rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("");
  drawDiag("bmM", bm.x, bm.M, q.bmL, "kN·m", true, t("bmDiagM"));
  drawDiag("bmV", bm.x, bm.V, q.bmL, "kN", false, t("bmDiagV"));
  drawDiag("bmD", bm.x, bm.d.map(v => -v), q.bmL, "mm", true, t("bmDiagD"));
  last.beam = { q, type, Ec, Ig, bm, rows, Mp: bm.M[iMp], Mn: bm.M[iMn], Vmax: Math.abs(bm.V[iV]) };
}
// 다이어그램: 기준선 위에 채운 곡선, 최대·최소에 값 표시. down=true면 양수를 아래로
function drawDiag(id, x, y, L, unit, down, label) {
  const W = 640, H = 170, Lm = 14, Rm = 14, T = 24, B = 20, mx = Math.max(...y.map(Math.abs)) || 1;
  const sx = v => Lm + v / L * (W - Lm - Rm), mid = (T + H - B) / 2, sy = v => mid + (down ? 1 : -1) * v / mx * ((H - T - B) / 2);
  const pts = x.map((xi, i) => `${sx(xi).toFixed(1)},${sy(y[i]).toFixed(1)}`).join(" ");
  let g = `<text class="lbl" x="${Lm}" y="13">${label}</text>` +
    `<polygon points="${sx(0)},${mid} ${pts} ${sx(L)},${mid}" fill="var(--block)" opacity=".55"/>` +
    `<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.5"/>` +
    `<line x1="${sx(0)}" x2="${sx(L)}" y1="${mid}" y2="${mid}" stroke="var(--fg)"/>`;
  [imax(y), imin(y)].forEach(i => {
    const v = y[i]; if (Math.abs(v) < 1e-9) return;
    const px = sx(x[i]), py = sy(v), anchor = px > W - 130 ? "end" : px < 130 ? "start" : "middle", below = down ? v > 0 : v < 0;
    g += `<circle cx="${px}" cy="${py}" r="3" fill="var(--fg)"/><text x="${px}" y="${py + (below ? 13 : -6)}" text-anchor="${anchor}">${f(v, 2)} ${unit} @ ${(x[i] / 1000).toFixed(2)} m</text>`;
  });
  $(id).innerHTML = g;
}
$("bmApply").addEventListener("click", () => {
  const b = last?.beam; if (!b) return;
  const M = Math.abs(b.Mp) >= Math.abs(b.Mn) ? b.Mp : b.Mn;
  $("Md").value = M.toFixed(2); $("Vd").value = b.Vmax.toFixed(2); render();
  $("bmMsg").textContent = `${t("bmApplied")}: Md = ${M.toFixed(2)} kN·m, Vd = ${b.Vmax.toFixed(2)} kN`;
});

// 눈금 간격: 1·2·5 × 10^n
const niceStep = raw => { const e = Math.pow(10, Math.floor(Math.log10(raw))), q = raw / e; return (q < 1.5 ? 1 : q < 3 ? 2 : q < 7 ? 5 : 10) * e; };
let mnState = null;
function drawMN(r, chk) {
  const W = 640, H = 340, L = 64, R = 20, T = 14, B = 40;
  const Ms = r.curve.map(q => q.M), Ns = r.curve.map(q => q.N);
  if (chk) { Ms.push(chk.dM); Ns.push(chk.dN); }
  const ax = (lo, hi) => { const st = niceStep((hi - lo) / 5 || 1); return { st, lo: Math.floor(lo / st) * st, hi: Math.ceil(hi / st) * st }; };
  const X = ax(Math.min(0, ...Ms), Math.max(0, ...Ms)), Y = ax(Math.min(0, ...Ns), Math.max(0, ...Ns));
  const sx = v => L + (v - X.lo) / (X.hi - X.lo) * (W - L - R), sy = v => H - B - (v - Y.lo) / (Y.hi - Y.lo) * (H - T - B);
  const ticks = A => { const o = []; for (let v = A.lo; v <= A.hi + A.st / 2; v += A.st) o.push(+v.toFixed(6)); return o; };
  let g = "";
  ticks(X).forEach(v => g += `<line x1="${sx(v)}" x2="${sx(v)}" y1="${T}" y2="${H - B}" stroke="var(--line)" stroke-width="${v === 0 ? 1.5 : 0.75}"/><text x="${sx(v)}" y="${H - B + 14}" text-anchor="middle">${v}</text>`);
  ticks(Y).forEach(v => g += `<line x1="${L}" x2="${W - R}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--line)" stroke-width="${v === 0 ? 1.5 : 0.75}"/><text x="${L - 6}" y="${sy(v) + 3}" text-anchor="end">${v}</text>`);
  g += `<text x="${(L + W - R) / 2}" y="${H - 6}" text-anchor="middle">M (kN·m)</text><text transform="translate(14 ${(T + H - B) / 2}) rotate(-90)" text-anchor="middle">N (kN)</text>`;
  const path = r.curve.map((q, i) => `${i ? "L" : "M"}${sx(q.M).toFixed(1)},${sy(q.N).toFixed(1)}`).join("");
  g += `<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;
  r.keys.forEach(k => {
    const left = sx(k.M) > W - R - 90;
    g += `<circle cx="${sx(k.M)}" cy="${sy(k.N)}" r="4.5" fill="var(--accent)" stroke="var(--panel)" stroke-width="2"/>` +
      `<text class="lbl" x="${sx(k.M) + (left ? -8 : 8)}" y="${sy(k.N) - 6}" text-anchor="${left ? "end" : "start"}">${kname(k)}</text>`;
  });
  if (chk) {
    const far = chk.ratio > 1 ? [chk.dM, chk.dN] : [chk.M, chk.N], dx = sx(chk.dM), dy = sy(chk.dN), left = dx > W - R - 110;
    g += `<line x1="${sx(0)}" y1="${sy(0)}" x2="${sx(far[0])}" y2="${sy(far[1])}" stroke="var(--muted)" stroke-dasharray="4 3"/>` +
      `<rect x="${dx - 5}" y="${dy - 5}" width="10" height="10" fill="${chk.ratio > 1 ? "var(--warn)" : "var(--ok)"}" stroke="var(--panel)" stroke-width="2"/>` +
      `<text class="lbl" x="${dx + (left ? -9 : 9)}" y="${dy + 16}" text-anchor="${left ? "end" : "start"}">${t("designPt")}</text>`;
  }
  g += `<g id="mnHover" visibility="hidden"><circle r="5" fill="var(--panel)" stroke="var(--fg)" stroke-width="2"/><text class="lbl"></text></g>` +
    `<rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/>`;
  $("mn").innerHTML = g;
  mnState = { r, sx, sy, W, R };
  $("mnTbl").innerHTML = `<tr><td>${t("ptCol")}</td><td>M (kN·m) / N (kN)</td></tr>` + r.keys.map(k => `<tr><td>${kname(k)}</td><td>${f(k.M)} / ${f(k.N, 0)}</td></tr>`).join("");
}
$("mn").addEventListener("pointermove", e => {
  if (!mnState) return;
  const { r, sx, sy, W, R } = mnState, svg = $("mn"), m = svg.getScreenCTM().inverse();
  const pt = new DOMPoint(e.clientX, e.clientY).matrixTransform(m);
  let best = r.curve[0], bd = Infinity;
  r.curve.forEach(q => { const dd = (sx(q.M) - pt.x) ** 2 + (sy(q.N) - pt.y) ** 2; if (dd < bd) { bd = dd; best = q; } });
  const hv = $("mnHover"), cx = sx(best.M), cy = sy(best.N), left = cx > W - R - 170;
  hv.setAttribute("visibility", "visible");
  hv.querySelector("circle").setAttribute("cx", cx); hv.querySelector("circle").setAttribute("cy", cy);
  const tx = hv.querySelector("text");
  tx.setAttribute("x", cx + (left ? -10 : 10)); tx.setAttribute("y", cy + 16); tx.setAttribute("text-anchor", left ? "end" : "start");
  tx.textContent = `M ${f(best.M)} kN·m, N ${f(best.N, 0)} kN`;
});
$("mn").addEventListener("pointerleave", () => $("mnHover")?.setAttribute("visibility", "hidden"));

// 단면도: 층(layers) 사각형 + 응력블록 + 철근. 200×240 영역에 비례 축척, 중앙 정렬
function drawSection(p, r) {
  const G = r.G, wmax = Math.max(...G.layers.map(l => l.w), ...G.extras.map(x => x.w)), ymin = Math.min(0, ...G.extras.map(x => x.y0)), ymax = Math.max(p.h, ...G.extras.map(x => x.y1)), hT = ymax - ymin;
  const sc = Math.min(200 / wmax, 240 / hT), cx = 110, Y = (260 - hT * sc) / 2 - ymin * sc, yy = v => Y + v * sc;
  let g = "";
  if (G.sec === "circle") {
    const R = p.h / 2 * sc, cy = yy(p.h / 2);
    g += `<clipPath id="secClip"><circle cx="${cx}" cy="${cy}" r="${R}"/></clipPath><circle cx="${cx}" cy="${cy}" r="${R}" fill="var(--bg)"/>` +
      `<rect x="${cx - R}" y="${Y}" width="${2 * R}" height="${r.a * sc}" fill="var(--block)" clip-path="url(#secClip)"/><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--fg)" stroke-width="1.5"/>`;
    G.bars.forEach(q => g += `<circle cx="${cx + q.z * sc}" cy="${yy(q.y)}" r="4" fill="var(--fg)"/>`);
  } else {
    // 층을 x 구간 목록으로: 박스의 웨브 층은 양쪽 벽 두 개
    const spans = l => G.sec === "box" && l.w < wmax - 1e-9 ? [[-wmax / 2, -wmax / 2 + p.tw], [wmax / 2 - p.tw, wmax / 2]] : [[-l.w / 2, l.w / 2]];
    const rects = (l, y0, hgt, fill, stroke) => spans(l).map(([x0, x1]) => `<rect x="${cx + x0 * sc}" y="${yy(y0)}" width="${(x1 - x0) * sc}" height="${hgt * sc}" fill="${fill}" ${stroke ? 'stroke="var(--fg)" stroke-width="1.5"' : ""}/>`).join("");
    for (const l of G.layers) g += rects(l, l.y0, l.y1 - l.y0, "var(--bg)", false);
    for (const l of G.layers) { const ov = Math.max(0, Math.min(r.a, l.y1) - l.y0); if (ov > 0) g += rects(l, l.y0, ov, "var(--block)", false); }
    for (const l of G.layers) g += rects(l, l.y0, l.y1 - l.y0, "none", true);
    const wIn = G.bw, bars = (y, n, rad) => n > 0 ? Array.from({ length: n }, (_, i) => `<circle cx="${cx + (n === 1 ? 0 : wIn * (-0.3 + 0.6 * i / (n - 1))) * sc}" cy="${yy(y)}" r="${rad}" fill="var(--fg)"/>`).join("") : "";
    g += bars(p.d, Math.min(p.As_n, 8), 5) + (p.As2 > 0 ? bars(p.d2, Math.min(p.As2_n, 8), 4.5) : "") + (p.Asc > 0 ? bars(p.dc, Math.min(p.Asc_n, 8), 3.5) : "");
    for (const x of G.extras) g += `<rect x="${cx - x.w / 2 * sc}" y="${yy(x.y0)}" width="${x.w * sc}" height="${Math.max(1.5, (x.y1 - x.y0) * sc)}" fill="${{ steel: "var(--steel)", uhpc: "var(--ok)", frp: "var(--warn)" }[x.mat.k]}" opacity=".75"/>`;   // 합성 층
  }
  g += `<line x1="${cx - wmax * sc / 2}" x2="${cx + wmax * sc / 2}" y1="${yy(r.x)}" y2="${yy(r.x)}" stroke="var(--accent)" stroke-dasharray="4 3"/><text x="${cx + wmax * sc / 2 + 3}" y="${yy(r.x) + 4}" font-size="9" fill="var(--accent)">x</text>`;
  $("sec").innerHTML = g;
}

// ---------- 엑셀 내보내기: 계산서 (값 열은 엑셀 수식, 셀 참조로 근거 추적) ----------
async function buildReport() {
  const { p, D, r } = last, wb = new ExcelJS.Workbook();
  wb.calcProperties.fullCalcOnLoad = true;   // 수식 결과는 열 때 엑셀이 계산
  const ws = wb.addWorksheet(t("c_sheet"), { views: [{ showGridLines: false }] });
  ws.columns = [{ width: 46 }, { width: 10 }, { width: 14 }, { width: 8 }, { width: 64 }];
  const fill = c => ({ type: "pattern", pattern: "solid", fgColor: { argb: c } });
  const thin = { style: "thin", color: { argb: "FFCFD5D8" } }, box = { top: thin, bottom: thin, left: thin, right: thin };
  const ref = {};   // 기호 → 값 셀 주소. 수식 속 {sym} 을 치환
  const fx = str => str.replace(/\{(\w+)\}/g, (_, k) => { if (!ref[k]) throw new Error("ref " + k); return ref[k]; });
  const title = (txt, size, bg, fg) => {
    const rw = ws.addRow([txt]); ws.mergeCells(rw.number, 1, rw.number, 5);
    rw.font = { bold: true, size, color: { argb: fg || "FF1D2326" } }; if (bg) rw.fill = fill(bg); rw.height = size + 8; return rw;
  };
  const section = key => { ws.addRow([]); title(t(key), 11, "FFDCE6EE"); };
  const head = () => {
    const h = ws.addRow([t("xItem"), t("c_sym"), t("xValue"), t("c_unit"), t("c_note")]);
    h.font = { bold: true, color: { argb: "FFFFFFFF" } }; h.fill = fill("FF1F5F8B"); h.eachCell(c => c.border = box);
  };
  // row(설명, 기호, 값 또는 "={수식}", 단위, 소수자릿수, 비고). 수식이면 비고란에 수식을 기호 그대로 적음
  const row = (label, sym, val, unit, dec = 2, note = "") => {
    const isF = typeof val === "string" && val[0] === "=";
    const rw = ws.addRow([label, sym, isF ? { formula: fx(val.slice(1)) } : val, unit, isF ? "= " + val.slice(1).replace(/[{}]/g, "") : note]);
    ref[sym] = "C" + rw.number;
    rw.eachCell({ includeEmpty: true }, c => { c.border = box; c.alignment = { vertical: "middle", wrapText: true }; });
    rw.getCell(3).numFmt = dec === 0 ? "#,##0" : "#,##0." + "0".repeat(dec); rw.getCell(3).alignment = { horizontal: "right", vertical: "middle" };
    rw.getCell(2).font = { italic: true }; rw.getCell(5).font = { size: 9, color: { argb: "FF5D676C" } };
    return rw;
  };
